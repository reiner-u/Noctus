name: Supabase Keep-Alive

on:
  schedule:
    # Monday and Thursday at 12:00 UTC — comfortably inside Supabase's
    # ~7 day inactivity window, with margin for scheduling delays
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Clean up previous heartbeat rows
        run: |
          curl -sf -X DELETE "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?id=gte.0" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

      - name: Insert heartbeat row
        run: |
          curl -sf -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'

# This performs a real write (insert, not just a read) using the
# service_role key, which bypasses RLS. Unlike the previous anon-key
# read against `assignments` — which RLS always reduces to an empty
# result, since that table is intentionally private-per-user — this
# is unambiguous database activity. The cleanup step keeps the
# heartbeat table from accumulating rows indefinitely.
